name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (root + nested)
        run: |
          python -m py_compile main.py
          python -m py_compile jarvis-trader-ecosystem/main.py || true
          python -m py_compile jarvis-trader-ecosystem/models/predictor.py || true

      - name: Import smoke (launcher)
        run: |
          python -c "import ast; ast.parse(open('main.py').read()); print('launcher OK')"
