name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Syntax compile
        run: |
          python -m py_compile main.py
          python -m py_compile scripts/check_config.py
          python -m py_compile jarvis-trader-ecosystem/main.py
          python -m py_compile jarvis-trader-ecosystem/models/predictor.py

      - name: Smoke tests
        run: python tests/test_smoke.py

      - name: Config check (expect fail without secrets)
        run: |
          python scripts/check_config.py && exit 1 || exit 0
